services:

  gateway:
    build: ./gateway
    ports:
      - "5050:5050"
    depends_on:
      - redis
      - user-service
      - product-service
      - order-service
    environment:
      - PORT=5050
      - JWT_SECRET=mySuperSecretKey
    volumes:
      - ./gateway:/app
      - /app/node_modules

  redis:
    image: redis
    ports:
      - "6379:6379"

  user-service:
    build: ./services/user-service
    ports:
      - "5051:5051"
    volumes:
      - ./services/user-service:/app
      - /app/node_modules

  product-service:
    build: ./services/product-service
    ports:
      - "5052:5052"
    volumes:
      - ./services/product-service:/app
      - /app/node_modules

  order-service:
    build: ./services/order-service
    ports:
      - "5053:5053"
    volumes:
      - ./services/order-service:/app
      - /app/node_modules